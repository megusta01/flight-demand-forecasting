[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anac-demanda"
version = "1.0.0"
description = "Previsão de passageiros por rota aérea no Brasil com dados abertos da ANAC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gustavo Figueredo" }]
keywords = ["previsão de demanda", "séries temporais", "aviação", "ANAC", "machine learning"]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.urls]
Repository = "https://github.com/megusta01/flight-demand-forecasting"
Issues = "https://github.com/megusta01/flight-demand-forecasting/issues"

[project.optional-dependencies]
app = ["streamlit>=1.35", "altair>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "ipykernel>=6", "nbconvert>=7", "pre-commit>=3"]

[project.scripts]
anac-demanda = "anac_demanda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806"]  # X maiúsculo é convenção em ML

[tool.coverage.run]
source = ["anac_demanda"]
omit = ["*/viz/*"]
